name: Mo Code Reviewer
description: 'A Code Review Action Powered By AI'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  anthropic-api-key:
    description: 'API key for Anthropic (required if using Anthropic as AI provider)'
    required: false
  openai-api-key:
    description: 'API key for OpenAI (required if using OpenAI as AI provider)'
    required: false
  openrouter-api-key:
    description: 'API key for OpenRouter (required if using OpenRouter as AI provider)'
    required: false
  trigger-label:
    description: 'The label that triggers the review process'
    required: true
    default: 'mo-review'
  ai-provider:
    description: 'The AI provider to use (anthropic, openai, openrouter)'
    required: false
    default: 'openrouter'
  severity:
    description: 'Severity levels to include in review (low|medium|high)'
    required: false
    default: 'high'
  openrouter-ai-model:
    description: 'AI model to use with OpenRouter (e.g., openai/gpt-4o-mini)'
    required: false
branding:
  icon: 'gift'
  color: orange
runs:
  using: 'node24'
  main: 'dist/index.js'